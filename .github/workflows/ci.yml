# Checks every pull request and every push to main. The ruleset on main requires
# the "CI result" job, which passes only when every other job here passed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add rustfmt
      - run: cargo fmt --all -- --check

  test:
    strategy:
      fail-fast: false
      matrix:
        # Intel macOS, as in release.yml: GitHub often has no free Apple Silicon runner.
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup default stable && rustup component add clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      # The parsers and editors must build without the GUI.
      - run: cargo build --locked --lib --no-default-features

  result:
    name: CI result
    if: always()
    needs: [fmt, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
