# Builds every package with the scripts in packaging/ and, for a version tag,
# attaches them to a draft GitHub Release for review.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must be "v" plus the version in Cargo.toml. A tag with a hyphen
# (v0.2.0-rc1) makes a prerelease. Run it by hand from the Actions tab to build
# the packages as workflow artifacts without making a release.
#
# Signing is optional; each part turns on when its secrets are set:
#   WINDOWS_SIGN_PFX_BASE64, WINDOWS_SIGN_PASSWORD   code signing certificate (base64 of the .pfx)
#   MACOS_SIGN_P12_BASE64, MACOS_SIGN_P12_PASSWORD,  Developer ID Application certificate
#   MACOS_SIGN_IDENTITY                              ("Developer ID Application: Name (TEAMID)")
#   MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID,     notarization, with an app-specific password;
#   MACOS_NOTARY_PASSWORD                            needs the macOS signing secrets as well
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version (expected v$version)"
            exit 1
          fi
      - run: rustup update stable --no-self-update && rustup default stable
      - run: cargo test --locked

  linux-bin:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          # Pinned toolchains: change the version and its SHA-256 together.
          v=0.13.0 sha=d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea
          curl -sSfL "https://ziglang.org/download/$v/zig-linux-x86_64-$v.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$sha  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/zig" && tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$HOME/zig" --strip-components=1
          cargo install --locked cargo-zigbuild --version 0.24.0
      - run: packaging/linux/build.sh bin
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: dist/*
          if-no-files-found: error

  # The Flatpak and the snap wrap the standalone executable from linux-bin, and
  # each is built on a runner of its own architecture.
  flatpak:
    needs: linux-bin
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: dist
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q flatpak flatpak-builder
          # Ubuntu 24.04 blocks the user namespaces that flatpak-builder's sandbox needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive --arch=${{ matrix.arch }} flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - run: ARCHS=${{ matrix.arch }} packaging/linux/build.sh flatpak
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-${{ matrix.arch }}
          path: dist/*.flatpak
          if-no-files-found: error

  snap:
    needs: linux-bin
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: dist
      - name: Tools
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd || sudo snap refresh lxd
          sudo lxd init --auto
          sudo usermod -aG lxd "$USER"
          # Docker on the runner drops forwarded traffic, which cuts the LXD build container off the network.
          sudo iptables -P FORWARD ACCEPT
      - run: ARCHS=${{ matrix.arch }} packaging/linux/build.sh snap
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.arch }}
          path: dist/*.snap
          if-no-files-found: error

  windows:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 nsis zip osslsigncode
          rustup update stable --no-self-update && rustup default stable
          rustup target add x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm
          # Pinned toolchain: change the version and its SHA-256 together.
          v=20250114 sha=a16f52dee819797248e6c7d63b8b1e50a92119f45767ecd8e9633d1733b896e2
          curl -sSfL "https://github.com/mstorsjo/llvm-mingw/releases/download/$v/llvm-mingw-$v-ucrt-ubuntu-20.04-x86_64.tar.xz" -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          echo "$sha  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c -
          mkdir -p "$HOME/llvm-mingw" && tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$HOME/llvm-mingw" --strip-components=1
      - name: Signing certificate
        env:
          PFX: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
        run: |
          [ -n "$PFX" ] || { echo "no WINDOWS_SIGN_PFX_BASE64 secret: the packages are unsigned"; exit 0; }
          echo "$PFX" | base64 --decode > "$RUNNER_TEMP/sign.pfx"
          echo "WINDOWS_SIGN_PFX=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_ENV"
      - run: packaging/windows/build.sh
        env:
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Signing certificate
        env:
          P12: ${{ secrets.MACOS_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "no MACOS_SIGN_P12_BASE64 secret: the app gets an ad hoc signature"; exit 0; }
          [ -n "$IDENTITY" ] || { echo "::error::MACOS_SIGN_P12_BASE64 is set but MACOS_SIGN_IDENTITY is not"; exit 1; }
          kc="$RUNNER_TEMP/sign.keychain-db"
          kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/sign.p12"
          security import "$RUNNER_TEMP/sign.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" login.keychain-db
          security default-keychain -s "$kc"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          [ -n "$APPLE_ID" ] || { echo "no MACOS_NOTARY_APPLE_ID secret: the DMG is not notarized"; exit 0; }
          xcrun notarytool store-credentials bxplore-notary --apple-id "$APPLE_ID" --team-id "$TEAM_ID" \
            --password "$NOTARY_PASSWORD" --keychain "$kc"
          echo "MACOS_NOTARY_PROFILE=bxplore-notary" >> "$GITHUB_ENV"
      - run: packaging/macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [flatpak, snap, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            # A re-run: replace the files of the draft, but never of a published release,
            # whose files people may already have downloaded and checked.
            [ "$draft" = true ] || { echo "::error::release $tag is already published"; exit 1; }
            gh release upload "$tag" dist/* --clobber
          else
            pre=""
            case "$tag" in *-*) pre="--prerelease" ;; esac
            gh release create "$tag" dist/* --draft --verify-tag $pre \
              --title "bxplore ${tag#v}" --generate-notes
          fi
