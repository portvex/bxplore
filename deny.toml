# Policy for `cargo deny check`: advisories, licenses, duplicate and banned
# crates, and where crates may come from.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Vulnerabilities always fail. "Unmaintained" notices fail only for crates this
# project depends on directly; for transitive ones (currently ttf-parser and the
# zbus family, pulled in by the GUI stack) there is nothing to change here.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
]

# The fonts bundled with egui carry their own font licenses.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
# The GUI stack pulls several versions of some crates; nothing to fix from here.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
