[package]
name = "bxplore"
version = "0.1.0"
edition = "2024"
# Set by the GUI stack: eframe 0.37 needs 1.95.
rust-version = "1.95"
license = "MIT"
publish = false

[features]
default = ["gui"]
# The desktop application. Without it only the parsers and editors are built,
# which is what the fuzz targets use.
gui = ["dep:eframe", "dep:egui_extras", "dep:rfd"]
# Development aid: environment driven screenshots of the GUI (see app.rs).
selftest = ["gui"]

[[bin]]
name = "bxplore"
required-features = ["gui"]

[dependencies]
capstone = "0.14.0"
eframe = { version = "0.37.0", optional = true }
egui_extras = { version = "0.37.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["png", "bmp", "ico"] }
md-5 = "0.11.0"
num-bigint = "0.5"
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }
rfd = { version = "0.18.0", optional = true }
sha1 = "0.11.0"
sha2 = "0.11.1"

[dev-dependencies]
# Installs the git hooks from .cargo-husky/hooks the first time tests are built.
cargo-husky = { version = "1.5.0", default-features = false, features = ["user-hooks"] }

# The md-5 package provides the `md5` crate, which cargo-machete cannot tell.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Parsers and table builders take many plain arguments by design.
too_many_arguments = "allow"
type_complexity = "allow"

# A single self-contained executable: `cargo standalone` (see .cargo/config.toml).
# Whole-program optimisation, no debug info or symbols. Static linking of the
# C runtime is set per target in .cargo/config.toml, since a profile cannot
# carry linker flags on stable Rust.
[profile.standalone]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
