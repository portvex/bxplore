[package]
name = "bxplore-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bxplore = { path = "..", default-features = false }
object = { version = "0.41.0", default-features = false, features = ["read"] }

# Keep this crate out of the parent workspace so `cargo build` ignores it.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "parse_any"
path = "fuzz_targets/parse_any.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_each"
path = "fuzz_targets/parse_each.rs"
test = false
doc = false
bench = false

